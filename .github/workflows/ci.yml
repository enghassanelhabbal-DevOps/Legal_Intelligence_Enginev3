name: CI

on:
  pull_request:
    branches: [developing, master, feat/enterprise-foundation]
  push:
    branches: [developing, master, feat/enterprise-foundation]

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (BM25/API/test tier — no torch/faiss download)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src api ui scripts --output-format=github

      - name: Type-check governed Stage 1/2 modules (runtime, domain, evaluation, core)
        # Scoped deliberately: these four packages are the Stage 1/2
        # canonical, torch-free governance layer (dataset intake, domain
        # contracts, and the ResolvedRuntimePlan/hardware/budget/fault
        # modules) and mypy-clean by construction. retrieval/reranking/
        # generation are NOT included here — mypy statically follows every
        # import it finds (including ones lazily deferred at runtime, e.g.
        # inside `if load_reranker:` or LLMManager's backend try-loaders),
        # so type-checking those packages would require torch/faiss/
        # sentence-transformers installed to resolve correctly, which
        # violates this job's "no heavy ML deps, no GPU" lightweight-tier
        # contract. See DR-032.
        run: python -m mypy src/legal_ai/runtime src/legal_ai/domain src/legal_ai/evaluation src/legal_ai/core

      - name: Unit tests (Stage 1/2 CPU-safe tier — no heavy ML deps, no GPU, no API secrets required)
        run: >
          python -m pytest tests/
          --ignore=tests/test_retrieval.py
          --ignore=tests/test_dense_reranker_adaptive_batch.py
          --ignore=tests/test_model_concurrency.py
          -v

      - name: Build real evaluation set from the actual corpus
        run: python scripts/build_eval_set.py --sample-size 80 --seed 42

      - name: Run regression harness (real BM25 engine, real corpus)
        run: python scripts/regression_harness.py

      - name: Quality gate (fails the build on retrieval regression)
        run: python scripts/quality_gate.py

      - name: Stage 2 runtime benchmark (hardware/plan/backpressure/adaptive-batch — lightweight path only)
        run: python scripts/runtime_benchmark.py

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: artifacts/reports/regression_baseline.json

      - name: Upload runtime benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-benchmark-report
          path: artifacts/reports/runtime_benchmark.json

  # Job B — CPU-only dense/reranker integration tier. Separate from
  # test-and-gate (Job A) because Stage 2 now directly changes dense.py,
  # cross_encoder.py, and torch_adaptive_batch.py, and Job A's lightweight
  # tier intentionally never installs torch/faiss/sentence-transformers to
  # verify them (RESOURCE_RELIABILITY_SPEC.md / DR-030). Ordinary CPU
  # PyTorch only — no CUDA toolkit, no GPU FAISS, no model downloads
  # (SentenceTransformer/CrossEncoder are replaced with deterministic
  # fakes in these tests; see DR-038).
  dense-cpu-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dense + dev dependencies (CPU-only torch, no CUDA/GPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dense,dev]"

      - name: Lint the dense-dependent modules this tier actually covers
        run: >
          python -m ruff check
          src/legal_ai/retrieval/dense.py
          src/legal_ai/reranking/cross_encoder.py
          src/legal_ai/runtime/torch_adaptive_batch.py
          tests/test_retrieval.py
          tests/test_dense_reranker_adaptive_batch.py
          tests/test_model_concurrency.py
          --output-format=github

      - name: Dense/reranker CPU integration tests
        run: >
          python -m pytest
          tests/test_retrieval.py
          tests/test_dense_reranker_adaptive_batch.py
          tests/test_model_concurrency.py
          -v

      - name: Integrated-path runtime benchmark (dense/reranker section must NOT be skipped here)
        run: |
          python scripts/runtime_benchmark.py
          python -c "
          import json
          report = json.load(open('artifacts/reports/runtime_benchmark.json'))
          section = report['integrated_dense_reranker_path']
          assert section['skipped'] is False, 'dense extra installed but benchmark section still skipped'
          print('integrated_dense_reranker_path measured (not skipped):', section['dense_encoder_batch_size_calls'])
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-and-gate, dense-cpu-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push — validates the Dockerfile stays buildable)
        run: docker build -t legal-rag-engine:ci .
