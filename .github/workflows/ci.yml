name: CI

on:
  pull_request:
    branches: [developing, master]
  push:
    branches: [developing, master]

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (BM25/API/test tier — no torch/faiss download)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic numpy rank-bm25 pyyaml python-dotenv requests
          pip install pytest pytest-cov ruff

      - name: Lint
        run: ruff check src api ui scripts --output-format=github

      - name: Unit tests (fast tier — no heavy ML deps required)
        run: pytest tests/ --ignore=tests/test_retrieval.py -v

      - name: Build real evaluation set from the actual corpus
        run: python scripts/build_eval_set.py --sample-size 80 --seed 42

      - name: Run regression harness (real BM25 engine, real corpus)
        run: python scripts/regression_harness.py

      - name: Quality gate (fails the build on retrieval regression)
        run: python scripts/quality_gate.py

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: artifacts/reports/regression_baseline.json

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-gate
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push — validates the Dockerfile stays buildable)
        run: docker build -t legal-rag-engine:ci .
