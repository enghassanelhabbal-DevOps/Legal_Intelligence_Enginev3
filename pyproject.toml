[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-intelligence-engine"
version = "0.3.0"
description = "Production-grade LLM-agnostic Legal AI Platform for Arabic legal retrieval"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "H Elhabbal" }]

# Core dependencies: the lightweight path only — BM25 retrieval, remote/
# OpenAI-compatible generation, the API/service layer, and Stage 1/2
# governance modules (runtime/, domain/, evaluation/). Deliberately does
# NOT include torch/faiss-cpu/sentence-transformers: those are heavy,
# sometimes GPU-driver-sensitive dependencies only needed for local dense
# retrieval/reranking/Qwen generation (see the `dense` and `qwen` extras
# below). A `pip install -e '.[streamlit]'` / bare `pip install -e .` on a
# remote-generation-only deployment (Streamlit Community Cloud, a thin API
# gateway) must not pull in torch — see DR-030.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "numpy>=1.26,<3",
    "rank-bm25>=0.2",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "psutil>=6.0,<8",
]

[project.optional-dependencies]
# Local dense retrieval/reranking (BGE-M3 encoder, FAISS index, BGE
# cross-encoder reranker). Required for `DenseEncoder`/`DenseIndex`/
# `Reranker`/`HybridRetriever`/`build_index`/`prepare_pipeline` — all
# already lazily imported (PEP 562 in retrieval/__init__.py, deferred
# import in pipeline.py for the reranker) so importing the package
# without this extra installed still works for the BM25 + remote-
# generation path; only calling these specific symbols requires it.
dense = [
    "torch>=2.5,<3",
    "sentence-transformers>=5.0,<6",
    "faiss-cpu>=1.8,<2",
]

# GPU-accelerated retrieval (swap faiss-cpu for faiss-gpu on a CUDA host).
gpu = ["faiss-gpu>=1.8,<2"]

# Local Qwen3 generation backend (transformers-based). Only needed on a host
# that will actually run local inference (e.g. the M2200-class dev GPU).
# Depends on `dense` for torch (self-referencing extra — requires pip>=21.2).
qwen = [
    "legal-intelligence-engine[dense]",
    "transformers>=4.50,<5",
    "accelerate>=1.10,<2",
    "safetensors>=0.5,<1",
    "huggingface_hub>=0.34",
]

# Minimal set for a Streamlit-Cloud-only deployment that talks to a remote
# API (or runs the OpenAI-compatible backend) — no torch/faiss required.
streamlit = [
    "streamlit>=1.36",
]

dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
legal-rag = "src.legal_ai.cli:main"
legal-ai-dataset = "src.legal_ai.evaluation.dataset_intake:main"

# Every module in this project imports itself as `src.legal_ai....` (59 call
# sites). Rather than rewrite every import, `src` is kept as the real
# top-level installed package (see src/__init__.py) so `pip install -e .`
# matches what the code already assumes at runtime.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
