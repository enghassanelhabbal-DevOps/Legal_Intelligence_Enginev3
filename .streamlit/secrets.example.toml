# Copy to .streamlit/secrets.toml locally, or set the same keys in
# Streamlit Cloud -> App -> Settings -> Secrets.
#
# ui/streamlit_app.py's _get_secret() reads these with priority:
# st.secrets -> os.environ -> default. Setting them here means the app works
# without anyone re-typing keys into the sidebar every session.

# Used in embedded mode (no LEGAL_API_URL) for the OpenAI-compatible backend.
OPENAI_API_KEY = "<your-openai-or-gemini-key>"
OPENAI_MODEL = "gpt-4o-mini"
OPENAI_BASE_URL = "https://api.openai.com/v1"
# For Gemini via its OpenAI-compatible endpoint instead, use:
#   OPENAI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
#   OPENAI_MODEL = "gemini-2.5-flash"
GOOGLE_API_KEY = ""

# Set this to run in Remote mode instead (UI calls a separately hosted API —
# see docs/BACKEND_DEPLOY.md). Leave empty to use Embedded mode.
LEGAL_API_URL = ""

# Keep at 0 on Streamlit Cloud (no GPU, and torch/faiss add cold-start time).
ALLOW_LOCAL_MODEL_RUNTIME = "0"
